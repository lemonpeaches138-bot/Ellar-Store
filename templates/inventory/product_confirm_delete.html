{% extends 'base.html' %}

{% block title %}Delete Product | Ellar Store{% endblock %}

{% block content %}
<h2>Delete Product</h2>
<p>Are you sure you want to delete <strong>{{ product.name }}</strong> ({{ product.sku }})?</p>
<form method="post" class="form-card">
    {% csrf_token %}
    <button type="submit" class="button danger">Yes, Delete</button>
    <a class="button secondary" href="{% url 'inventory:product-list' %}">Cancel</a>
</form>
{% endblock %}
